name: Deploy Supabase Edge Functions

# Runs automatically whenever you push changes under
# supabase/functions/ to main — same pattern as your existing
# "Build ZetraMail APK" workflow, just for the alert function instead
# of the app itself. You can also trigger it by hand from the Actions
# tab (workflow_dispatch) if you want to redeploy without a code change.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy security-alert-notify function
        run: |
          supabase functions deploy security-alert-notify \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
