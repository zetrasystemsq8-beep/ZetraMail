name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate keystore
        run: |
          STORE_PASS=$(openssl rand -base64 24)
          keytool -genkey -v \
            -keystore zetramail-release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias zetramail \
            -storepass "$STORE_PASS" \
            -keypass "$STORE_PASS" \
            -dname "CN=ZetraMail, OU=Zetra, O=Zetra, L=Unknown, S=Unknown, C=US"

          echo "STORE_PASS=$STORE_PASS" >> "$GITHUB_ENV"
          base64 -w 0 zetramail-release.jks > zetramail-keystore-base64.txt
          echo "B64=$(cat zetramail-keystore-base64.txt)" >> "$GITHUB_ENV"

      - name: Push secrets to repo
        env:
          GH_TOKEN: ${{ secrets.ADMIN_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh secret set KEYSTORE_BASE64 --body "$B64"
          gh secret set KEYSTORE_PASSWORD --body "$STORE_PASS"
          gh secret set KEY_PASSWORD --body "$STORE_PASS"
          gh secret set KEY_ALIAS --body "zetramail"

      - name: Upload only the keystore file to you
        uses: actions/upload-artifact@v4
        with:
          name: zetramail-keystore-jks
          path: zetramail-release.jks
          retention-days: 1
